aid: changeengine
name: ChangeEngine
description: >-
  ChangeEngine is an AI-enabled internal communications and employee engagement platform for HR,
  People, and Internal Comms teams. Founded in 2020 and headquartered in the United States, it
  combines marketing technology with people operations to automate, personalize, and measure
  internal messages across email, Slack, Microsoft Teams, SMS, and digital signage. Core products
  include a Workforce Communication Orchestrator, Employee Journey Builder, AI Content Creation
  Studio, Rewards & Recognition Automation, a Two-Way SMS Text Agent, Surveys & Listening
  Intelligence, and Engagement Analytics. ChangeEngine integrates with 50+ HRIS systems (Workday,
  BambooHR, UKG), Active Directory/Okta, and Microsoft 365/Google Workspace to enrich messaging
  with real-time employee data. It publishes an llms.txt and a Security & Trust Center, and is
  SOC 2 certified and GDPR compliant, but exposes no public first-party developer API.
